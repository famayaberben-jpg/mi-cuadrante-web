<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi Cuadrante</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-dark: #3f37b6;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --bg: #eef2ff;
      --panel: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: var(--text);
      min-height: 100vh;
      padding: 24px;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    header {
      background: rgba(255,255,255,0.96);
      border-radius: 18px;
      padding: 26px 20px;
      text-align: center;
      box-shadow: 0 12px 25px rgba(0,0,0,0.12);
      margin-bottom: 20px;
    }

    h1 { margin: 0; font-size: clamp(2rem, 5vw, 2.8rem); }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 18px;
    }

    nav button {
      flex: 1 1 140px;
      border: none;
      border-radius: 12px;
      padding: 14px 16px;
      font-weight: 700;
      cursor: pointer;
      background: rgba(255,255,255,0.9);
      color: var(--primary);
      box-shadow: 0 8px 18px rgba(0,0,0,0.08);
    }

    nav button.activo {
      background: var(--primary);
      color: white;
    }

    section {
      background: rgba(255,255,255,0.96);
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 12px 25px rgba(0,0,0,0.12);
      min-height: 240px;
    }

    section.oculto { display: none; }

    .panel {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 18px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      align-items: end;
    }

    label {
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      color: #374151;
    }

    input, select, button.primary {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.95rem;
    }

    button.primary {
      background: var(--primary);
      color: white;
      border: none;
      font-weight: 700;
      cursor: pointer;
    }

    .week-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(120px, 1fr));
      gap: 12px;
      margin-top: 18px;
    }

    .day-card {
      min-height: 140px;
      background: white;
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .day-card:hover { border-color: var(--primary); }
    .day-card.activo {
      background: linear-gradient(135deg, var(--primary) 0%, #7c3aed 100%);
      color: white;
      border-color: var(--primary);
    }
    .day-card.hoy {
      border-color: var(--success);
      background: #f0fdf4;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
      margin-top: 16px;
    }

    .card {
      background: linear-gradient(135deg, var(--primary) 0%, #7c3aed 100%);
      color: white;
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 8px 18px rgba(79,70,229,0.2);
    }

    .card h3 { margin-top: 0; }
    .card p { margin: 8px 0; }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 14px;
    }

    .button-row button {
      flex: 1 1 150px;
      min-height: 44px;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      color: white;
      cursor: pointer;
      background: var(--primary);
    }

    .button-row button.success { background: var(--success); }
    .button-row button.warning { background: var(--warning); }
    .button-row button.danger { background: var(--danger); }

    .json-panel {
      background: #1f2937;
      color: #10b981;
      border-radius: 14px;
      padding: 16px;
      font-family: "Consolas", monospace;
      font-size: 0.85rem;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 360px;
      overflow: auto;
      margin-top: 12px;
    }

    .notification {
      position: fixed;
      top: 20px;
      right: 20px;
      background: var(--success);
      color: white;
      padding: 14px 18px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      z-index: 1000;
      animation: slideIn 0.25s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(30px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @media (max-width: 680px) {
      body { padding: 12px; }
      .week-grid { grid-template-columns: repeat(2, minmax(120px, 1fr)); }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>📅 Mi Cuadrante</h1>
    </header>

    <nav>
      <button class="activo" data-view="calendario">📆 Calendario</button>
      <button data-view="turnos">📋 Turnos</button>
      <button data-view="datos">💾 Datos</button>
    </nav>

    <section id="calendario">
      <div class="panel">
        <h2 id="mesAnio">Calendario</h2>
        <div id="weekGrid" class="week-grid"></div>
      </div>
    </section>

    <section id="turnos" class="oculto">
      <div class="panel">
        <h2>➕ Añadir turno</h2>
        <div class="form-grid">
          <label>
            Nombre del turno
            <input id="tipoTurno" type="text" value="Jornada backup" />
          </label>
          <label>
            Hora inicio
            <input id="horaInicio" type="time" value="09:00" />
          </label>
          <label>
            Hora fin
            <input id="horaFin" type="time" value="17:00" />
          </label>
          <button class="primary" id="btnAgregarTurno">Añadir turno</button>
        </div>
      </div>

      <div id="listaTurnos" class="cards"></div>
    </section>

    <section id="datos" class="oculto">
      <div class="panel">
        <h2>💾 Datos cargados automáticamente</h2>
        <p>Si existe <strong>jornada_backup_2026_octubre.json</strong> en la raíz del proyecto, se carga al abrir la página.</p>
        <div class="button-row">
          <button class="success" id="btnExportar">📥 Exportar JSON</button>
          <button class="warning" id="btnImportar">📤 Importar JSON</button>
          <button class="danger" id="btnLimpiar">🗑️ Limpiar</button>
        </div>
        <input type="file" id="fileInput" accept=".json" style="display:none" />
        <div id="jsonPreview" class="json-panel">Cargando backup...</div>
      </div>
    </section>
  </div>

  <script>
    const STORAGE_KEY = 'mi-cuadrante-estado';
    const BACKUP_KEY = 'mi-cuadrante-backup';
    const defaultData = {
      turnos: [{ id: 1, tipo: 'Jornada backup', inicio: '09:00', fin: '17:00' }],
      calendario: {}
    };

    function mostrarNotificacion(msg) {
      const node = document.createElement('div');
      node.className = 'notification';
      node.textContent = msg;
      document.body.appendChild(node);
      setTimeout(() => node.remove(), 2200);
    }

    function getState() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(defaultData));
        return JSON.parse(JSON.stringify(defaultData));
      }

      try {
        return JSON.parse(raw);
      } catch (e) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(defaultData));
        return JSON.parse(JSON.stringify(defaultData));
      }
    }

    function saveState(state) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      renderCalendario();
      renderTurnos();
      renderJsonPreview();
    }

    function mostrarVista(nombre) {
      document.querySelectorAll('nav button').forEach(btn => btn.classList.toggle('activo', btn.dataset.view === nombre));
      document.querySelectorAll('section').forEach(section => {
        const visible = section.id === nombre;
        section.classList.toggle('oculto', !visible);
      });
    }

    function formatHorario(inicio, fin) {
      return `${inicio || '00:00'} - ${fin || '00:00'}`;
    }

    function calcularHoras(inicio, fin) {
      if (!inicio || !fin) return 0;
      const [h1, m1] = inicio.split(':').map(Number);
      const [h2, m2] = fin.split(':').map(Number);
      return Math.max(0, (h2 * 60 + m2) - (h1 * 60 + m1)) / 60;
    }

    function getLunesSemana(fecha) {
      const d = new Date(fecha);
      const day = d.getDay();
      const diff = d.getDate() - day + (day === 0 ? -6 : 1);
      return new Date(d.setDate(diff));
    }

    function renderCalendario() {
      const state = getState();
      const base = getLunesSemana(new Date());
      const grid = document.getElementById('weekGrid');
      const html = [];

      for (let i = 0; i < 7; i++) {
        const date = new Date(base);
        date.setDate(base.getDate() + i);
        const iso = date.toISOString().split('T')[0];
        const active = state.calendario?.[iso];
        const turno = active ? state.turnos.find(t => t.id === active.turnoId) : null;
        const dayName = ['LUN', 'MAR', 'MIÉ', 'JUE', 'VIE', 'SÁB', 'DOM'][i];
        const today = new Date().toISOString().split('T')[0] === iso;

        html.push(`
          <div class="day-card ${active ? 'activo' : ''} ${today ? 'hoy' : ''}">
            <div>${dayName}</div>
            <div style="font-weight:700; font-size:1.1rem; margin:8px 0;">${date.getDate()}</div>
            ${turno ? `<div><strong>${turno.tipo}</strong><div>${formatHorario(turno.inicio, turno.fin)}</div></div>` : '<div style="opacity:0.7;">Añadir turno</div>'}
          </div>
        `);
      }

      grid.innerHTML = html.join('');
      const month = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'][base.getMonth()];
      document.getElementById('mesAnio').textContent = `${month} ${base.getFullYear()}`;
    }

    function renderTurnos() {
      const state = getState();
      const lista = document.getElementById('listaTurnos');

      lista.innerHTML = (state.turnos || []).map(turno => `
        <div class="card">
          <h3>🏷️ ${turno.tipo}</h3>
          <p><strong>Horario:</strong> ${formatHorario(turno.inicio, turno.fin)}</p>
          <p><strong>Duración:</strong> ${calcularHoras(turno.inicio, turno.fin).toFixed(1)}h</p>
        </div>
      `).join('');
    }

    function renderJsonPreview() {
      const preview = document.getElementById('jsonPreview');
      const backup = JSON.parse(localStorage.getItem(BACKUP_KEY) || 'null');
      if (backup) {
        preview.textContent = JSON.stringify(backup, null, 2);
      } else {
        preview.textContent = JSON.stringify(getState(), null, 2);
      }
    }

    function convertirBackupABase(backup) {
      if (!backup || !backup.entries || typeof backup.entries !== 'object') return null;

      const keys = Object.keys(backup.entries);
      const turnos = [{ id: 1, tipo: 'Jornada backup', inicio: '09:00', fin: '17:00' }];
      const calendario = {};

      keys.forEach(date => {
        calendario[date] = { turnoId: 1, horas: Number(backup.entries[date]) || 0 };
      });

      return { turnos, calendario };
    }

    async function cargarBackupAutomatico() {
      try {
        const response = await fetch('./jornada_backup_2026_octubre.json', { cache: 'no-store' });
        if (!response.ok) {
          renderJsonPreview();
          return;
        }

        const backup = await response.json();
        localStorage.setItem(BACKUP_KEY, JSON.stringify(backup));

        const base = convertirBackupABase(backup);
        if (base) {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(base));
          renderCalendario();
          renderTurnos();
        }

        renderJsonPreview();
        mostrarNotificacion('✅ Backup cargado automáticamente');
      } catch (err) {
        console.warn('No se encontró o no se pudo cargar el backup automatico:', err);
        renderJsonPreview();
      }
    }

    function manejarImportacion(event) {
      const file = event.target.files?.[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(reader.result);
          localStorage.setItem(BACKUP_KEY, JSON.stringify(parsed));

          const base = convertirBackupABase(parsed);
          if (base) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(base));
            renderCalendario();
            renderTurnos();
          }

          renderJsonPreview();
          mostrarNotificacion('✅ JSON importado');
        } catch (error) {
          alert('El JSON no es válido');
        }
      };
      reader.readAsText(file);
    }

    function exportarJSON() {
      const source = JSON.parse(localStorage.getItem(BACKUP_KEY) || JSON.stringify(getState()));
      const blob = new Blob([JSON.stringify(source, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'mi-cuadrante-export.json';
      a.click();
      URL.revokeObjectURL(url);
      mostrarNotificacion('✅ JSON exportado');
    }

    function limpiarTodo() {
      localStorage.removeItem(STORAGE_KEY);
      localStorage.removeItem(BACKUP_KEY);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(defaultData));
      renderCalendario();
      renderTurnos();
      renderJsonPreview();
      mostrarNotificacion('✅ Datos limpiados');
    }

    document.querySelectorAll('nav button').forEach(button => {
      button.addEventListener('click', () => mostrarVista(button.dataset.view));
    });

    document.getElementById('btnAgregarTurno').addEventListener('click', () => {
      const state = getState();
      const tipo = document.getElementById('tipoTurno').value.trim() || 'Jornada';
      const inicio = document.getElementById('horaInicio').value || '09:00';
      const fin = document.getElementById('horaFin').value || '17:00';
      const id = Date.now();
      state.turnos = [...(state.turnos || []), { id, tipo, inicio, fin }];
      saveState(state);
      mostrarNotificacion('✅ Turno añadido');
    });

    document.getElementById('btnExportar').addEventListener('click', exportarJSON);
    document.getElementById('btnImportar').addEventListener('click', () => document.getElementById('fileInput').click());
    document.getElementById('fileInput').addEventListener('change', manejarImportacion);
    document.getElementById('btnLimpiar').addEventListener('click', limpiarTodo);

    window.addEventListener('DOMContentLoaded', () => {
      const existing = getState();
      renderCalendario();
      renderTurnos();
      renderJsonPreview();
      cargarBackupAutomatico();
      mostrarVista('calendario');
      if (!existing || !existing.turnos || existing.turnos.length === 0) {
        saveState(defaultData);
      }
    });
  </script>
</body>
</html>
