<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Cuadrante</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
      color: #1f2937;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      background: rgba(255,255,255,0.96);
      border-radius: 18px;
      padding: 28px 20px;
      text-align: center;
      box-shadow: 0 12px 25px rgba(0,0,0,0.12);
      margin-bottom: 18px;
    }

    h1 {
      font-size: clamp(2rem, 4vw, 2.8rem);
      font-weight: 800;
    }

    nav {
      display: flex;
      gap: 12px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    nav button {
      border: none;
      border-radius: 12px;
      padding: 14px 20px;
      font-size: 1rem;
      font-weight: 700;
      background: rgba(255,255,255,0.9);
      color: #4f46e5;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(0,0,0,0.08);
      transition: transform 0.2s ease, background 0.2s ease;
      flex: 1;
      min-width: 120px;
    }

    nav button:hover {
      transform: translateY(-1px);
    }

    nav button.activo {
      background: #4f46e5;
      color: white;
    }

    nav button.util {
      background: rgba(255,165,0,0.9);
      color: white;
      flex: 0 1 auto;
    }

    nav button.util:hover {
      background: rgba(255,140,0,1);
    }

    section {
      background: rgba(255,255,255,0.96);
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 12px 25px rgba(0,0,0,0.12);
      min-height: 300px;
    }

    section.oculto {
      display: none;
    }

    .panel {
      background: #f8fafc;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 18px;
      border: 1px solid #e5e7eb;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      align-items: end;
    }

    label {
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      color: #374151;
    }

    input, select, button.primary {
      border: 1px solid #d1d5db;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.95rem;
    }

    button.primary {
      background: #4f46e5;
      color: white;
      border: none;
      font-weight: 700;
      cursor: pointer;
    }

    button.primary:hover {
      background: #4338ca;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-top: 18px;
    }

    .card {
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      border-radius: 14px;
      padding: 18px;
      color: white;
      box-shadow: 0 8px 18px rgba(79,70,229,0.2);
    }

    .card h3 {
      font-size: 1.2rem;
      margin-bottom: 10px;
    }

    .card p {
      margin: 8px 0;
      font-size: 1rem;
    }

    .card strong {
      font-size: 1.05rem;
    }

    .card button {
      background: rgba(255,255,255,0.2);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.8rem;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s;
    }

    .card button:hover {
      background: rgba(255,255,255,0.3);
    }

    .stats-card {
      background: white;
      border: 1px solid #e5e7eb;
      color: #1f2937;
      box-shadow: none;
    }

    .stats-card h3 {
      color: #4f46e5;
      text-align: center;
      margin-bottom: 10px;
    }

    .stats-card p {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid #e5e7eb;
      padding: 10px 0;
      margin: 0;
    }

    .stats-card p:last-child {
      border-bottom: none;
      margin-top: 8px;
      font-size: 1.08rem;
    }

    .empty {
      text-align: center;
      color: #6b7280;
      padding: 20px 10px;
      font-style: italic;
    }

    .json-panel {
      background: #1f2937;
      color: #10b981;
      border-radius: 14px;
      padding: 16px;
      font-family: 'Monaco', 'Courier New', monospace;
      font-size: 0.85rem;
      line-height: 1.5;
      overflow-x: auto;
      margin: 16px 0;
      max-height: 300px;
      overflow-y: auto;
      border: 1px solid #374151;
    }

    .json-panel pre {
      margin: 0;
    }

    .button-group {
      display: flex;
      gap: 12px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .button-group button {
      flex: 1;
      min-width: 140px;
    }

    .success {
      background: #10b981;
      border: 1px solid #059669;
    }

    .danger {
      background: #ef4444;
      border: 1px solid #dc2626;
    }

    #fileInput {
      display: none;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal.activo {
      display: flex;
    }

    .modal-content {
      background: white;
      border-radius: 18px;
      padding: 24px;
      max-width: 500px;
      width: 90%;
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    }

    .modal-content h2 {
      margin-bottom: 16px;
      color: #1f2937;
    }

    .modal-content p {
      margin: 12px 0;
      color: #6b7280;
    }

    .modal-buttons {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }

    .modal-buttons button {
      flex: 1;
      border: none;
      border-radius: 10px;
      padding: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .modal-buttons button:hover {
      transform: translateY(-1px);
    }

    .btn-cancel {
      background: #e5e7eb;
      color: #1f2937;
    }

    .btn-confirm {
      background: #4f46e5;
      color: white;
    }

    @media (max-width: 600px) {
      nav {
        flex-direction: column;
      }

      nav button {
        flex: 1;
      }

      section {
        padding: 18px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>📅 Mi Cuadrante</h1>
    </header>

    <nav>
      <button class="activo" onclick="mostrarVista('turnos')">📅 Turnos</button>
      <button onclick="mostrarVista('estadisticas')">📊 Estadísticas</button>
      <button class="util" onclick="mostrarVista('datos')">💾 Datos</button>
    </nav>

    <section id="turnos">
      <div class="panel">
        <div class="form-grid">
          <label>
            Nombre del turno
            <input id="tipoTurno" type="text" placeholder="Ej: Oficina, Home office..." value="Oficina">
          </label>
          <label>
            Hora inicio
            <input id="horaInicio" type="time" value="09:00">
          </label>
          <label>
            Hora fin
            <input id="horaFin" type="time" value="17:00">
          </label>
          <button class="primary" id="btnAgregarTurno">Añadir turno</button>
        </div>
      </div>

      <div id="listaTurnos" class="cards"></div>
    </section>

    <section id="estadisticas" class="oculto">
      <div id="contenedorStats"></div>
    </section>

    <section id="datos" class="oculto">
      <div class="panel">
        <h2 style="margin-bottom: 16px; color: #1f2937;">💾 Gestión de Datos</h2>
        <p style="margin-bottom: 16px; color: #6b7280;">Exporta e importa tus turnos en formato JSON. Puedes guardar una copia de seguridad o compartir tus datos.</p>
        
        <div class="button-group">
          <button class="primary success" onclick="exportarJSON()">📥 Exportar JSON</button>
          <button class="primary" onclick="document.getElementById('fileInput').click()">📤 Importar JSON</button>
          <button class="primary danger" onclick="mostrarConfirmacionLimpiar()">🗑️ Limpiar todo</button>
        </div>

        <input type="file" id="fileInput" accept=".json" onchange="manejarArchivo(event)">

        <h3 style="margin-top: 24px; margin-bottom: 12px; color: #1f2937;">Vista previa JSON:</h3>
        <div class="json-panel">
          <pre id="jsonPreview"></pre>
        </div>
      </div>
    </section>
  </div>

  <div id="modal" class="modal">
    <div class="modal-content">
      <h2 id="modalTitle">Confirmar</h2>
      <p id="modalMessage"></p>
      <div class="modal-buttons">
        <button class="btn-cancel" onclick="cerrarModal()">Cancelar</button>
        <button class="btn-confirm" id="btnModalConfirm">Confirmar</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'mi-cuadrante-web-state';

    const defaultData = {
      turnos: [
        { tipo: 'Teletrabajo', inicio: '15:00', fin: '23:00' },
        { tipo: 'Oficina', inicio: '09:00', fin: '17:00' }
      ]
    };

    function getState() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(defaultData));
        return JSON.parse(JSON.stringify(defaultData));
      }

      try {
        return JSON.parse(raw);
      } catch (error) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(defaultData));
        return JSON.parse(JSON.stringify(defaultData));
      }
    }

    function saveState(state) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      actualizarPreview();
    }

    function formatearHorario(inicio, fin) {
      if (!inicio || !fin) return 'Sin horario';
      return `${inicio} - ${fin}`;
    }

    function renderTurnos() {
      const state = getState();
      const lista = document.getElementById('listaTurnos');

      if (!state.turnos || state.turnos.length === 0) {
        lista.innerHTML = '<div class="empty">No hay turnos guardados todavía.</div>';
        return;
      }

      lista.innerHTML = state.turnos.map((turno, index) => `
        <div class="card">
          <h3>🏷️ ${turno.tipo}</h3>
          <p><strong>Horario:</strong> ${formatearHorario(turno.inicio, turno.fin)}</p>
          <button data-index="${index}" onclick="eliminarTurno(${index})">Eliminar</button>
        </div>
      `).join('');
    }

    function eliminarTurno(index) {
      const state = getState();
      state.turnos.splice(index, 1);
      saveState(state);
      renderTurnos();
      renderStats();
    }

    function calcularEstadisticas() {
      const state = getState();
      const turnos = state.turnos || [];

      const total = turnos.length;
      const teletrabajo = turnos.filter(t => /teletrabajo|home|remote/i.test(t.tipo)).length;
      const oficina = turnos.filter(t => /oficina|presencial|office/i.test(t.tipo)).length;
      const libres = Math.max(0, 30 - total);

      return {
        total,
        teletrabajo,
        oficina,
        libres,
        horas: turnos.reduce((acc, turno) => {
          if (!turno.inicio || !turno.fin) return acc;
          const [h1, m1] = turno.inicio.split(':').map(Number);
          const [h2, m2] = turno.fin.split(':').map(Number);
          const inicioMin = h1 * 60 + m1;
          const finMin = h2 * 60 + m2;
          const diff = Math.max(0, finMin - inicioMin);
          return acc + (diff / 60);
        }, 0)
      };
    }

    function renderStats() {
      const stats = calcularEstadisticas();
      document.getElementById('contenedorStats').innerHTML = `
        <div class="card stats-card">
          <h3>📊 Estadísticas</h3>
          <p><span>🏠 Teletrabajo</span> <span>${stats.teletrabajo}</span></p>
          <p><span>🏢 Oficina</span> <span>${stats.oficina}</span></p>
          <p><span>👍 Libres</span> <span>${stats.libres}</span></p>
          <p><span>🕒 Total horas</span> <span>${stats.horas.toFixed(1)}h</span></p>
        </div>
      `;
    }

    function agregarTurno() {
      const tipo = document.getElementById('tipoTurno').value.trim();
      const inicio = document.getElementById('horaInicio').value;
      const fin = document.getElementById('horaFin').value;

      if (!tipo) {
        alert('Escribe un nombre para el turno');
        return;
      }

      if (!inicio || !fin) {
        alert('Debes indicar la hora de inicio y fin');
        return;
      }

      const state = getState();
      state.turnos.push({ tipo, inicio, fin });
      saveState(state);
      renderTurnos();
      renderStats();
      document.getElementById('tipoTurno').value = '';
      document.getElementById('tipoTurno').focus();
    }

    function exportarJSON() {
      const state = getState();
      const dataStr = JSON.stringify(state, null, 2);
      const dataBlob = new Blob([dataStr], { type: 'application/json' });
      const url = URL.createObjectURL(dataBlob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `mi-cuadrante-${new Date().toISOString().split('T')[0]}.json`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }

    function manejarArchivo(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const data = JSON.parse(e.target.result);

          if (!data.turnos || !Array.isArray(data.turnos)) {
            alert('Formato JSON no válido. Debe contener un array de "turnos".');
            return;
          }

          mostrarConfirmacionImportar(data);
        } catch (error) {
          alert(`Error al leer el archivo: ${error.message}`);
        }
      };
      reader.readAsText(file);
      document.getElementById('fileInput').value = '';
    }

    function mostrarConfirmacionImportar(data) {
      const modal = document.getElementById('modal');
      document.getElementById('modalTitle').textContent = '🔄 Importar datos';
      document.getElementById('modalMessage').textContent = 
        `Se importarán ${data.turnos.length} turno(s). ¿Los datos actuales se reemplazarán.`;
      
      const btnConfirm = document.getElementById('btnModalConfirm');
      btnConfirm.textContent = 'Importar';
      btnConfirm.onclick = () => {
        saveState(data);
        renderTurnos();
        renderStats();
        cerrarModal();
        mostrarVista('turnos');
        alert('✅ Datos importados correctamente');
      };
      modal.classList.add('activo');
    }

    function mostrarConfirmacionLimpiar() {
      const modal = document.getElementById('modal');
      document.getElementById('modalTitle').textContent = '⚠️ Limpiar todo';
      document.getElementById('modalMessage').textContent = 
        'Se eliminarán todos los turnos. Esta acción no se puede deshacer.';
      
      const btnConfirm = document.getElementById('btnModalConfirm');
      btnConfirm.textContent = 'Limpiar todo';
      btnConfirm.style.background = '#ef4444';
      btnConfirm.onclick = () => {
        saveState({ turnos: [] });
        renderTurnos();
        renderStats();
        cerrarModal();
        alert('✅ Datos eliminados');
      };
      modal.classList.add('activo');
    }

    function cerrarModal() {
      document.getElementById('modal').classList.remove('activo');
    }

    function actualizarPreview() {
      const state = getState();
      document.getElementById('jsonPreview').textContent = JSON.stringify(state, null, 2);
    }

    function mostrarVista(id) {
      document.getElementById('turnos').classList.add('oculto');
      document.getElementById('estadisticas').classList.add('oculto');
      document.getElementById('datos').classList.add('oculto');

      document.querySelectorAll('nav button').forEach(btn => btn.classList.remove('activo'));
      document.getElementById(id).classList.remove('oculto');
      
      const textos = { turnos: 'Turnos', estadisticas: 'Estadísticas', datos: 'Datos' };
      const activeButton = [...document.querySelectorAll('nav button')].find(btn => 
        btn.textContent.includes(textos[id])
      );
      if (activeButton) activeButton.classList.add('activo');
    }

    document.getElementById('btnAgregarTurno').addEventListener('click', agregarTurno);
    document.getElementById('tipoTurno').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') agregarTurno();
    });

    renderTurnos();
    renderStats();
    actualizarPreview();
  </script>
</body>
</html>
